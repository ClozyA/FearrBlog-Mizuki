name: Weekly upstream sync

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Validate and sync upstream
    runs-on: ubuntu-latest
    env:
      ENABLE_CONTENT_SYNC: "true"
      CONTENT_REPO_URL: https://github.com/ClozyA/FearrBlog-Content.git
      CONTENT_DIR: ./content
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: publish
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare candidate merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LyraVoid/Mizuki.git
          git fetch origin master publish --prune
          git fetch upstream master --prune
          echo "ORIGIN_MASTER_SHA=$(git rev-parse origin/master)" >> "$GITHUB_ENV"
          echo "ORIGIN_PUBLISH_SHA=$(git rev-parse origin/publish)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git rev-parse upstream/master)" >> "$GITHUB_ENV"
          git switch --force-create sync-candidate origin/publish
          git merge --no-edit upstream/master

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync production content
        run: pnpm run sync-content

      - name: Run sync tests
        run: pnpm test

      - name: Run Astro check
        run: pnpm check

      - name: Build production site
        run: pnpm build

      - name: Verify production output
        run: pnpm test

      - name: Push validated branches
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic origin "$UPSTREAM_SHA:refs/heads/master" "HEAD:refs/heads/publish" "--force-with-lease=refs/heads/master:$ORIGIN_MASTER_SHA"

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Weekly upstream sync failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const body = `Automatic upstream sync failed. Review the run: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close resolved failure issue
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Weekly upstream sync failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Automatic upstream sync recovered successfully: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
